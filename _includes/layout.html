<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FNPSO</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <link href={{"/bundle.css" | url}} rel="stylesheet" />
  </head>
  <body>
    <nav id="navbar">
      <div class="logo">
        <a href="#">FNPSO</a>
      </div>
      <ul class="nav-links">
        <li class="{% if title == 'Home' %}current-page{% endif %}">
          <a
            href={{ "/" | url }}
            class="{% if title == 'Home' %}current-page-color{% else %}not-selected-page{% endif %}"
            >Home</a
          >
        </li>
        <li class="{% if title == 'About' %}current-page{% endif %}">
          <a
            href={{ "about" | url}}
            class="{% if title == 'About' %}current-page-color{% else %}not-selected-page{% endif %}"
            >About</a
          >
        </li>
        <li class="{% if title == 'Posts' %}current-page{% endif %}">
          <a
            href={{ "posts" | url}}
            class="{% if title == 'Posts' %}current-page-color{% else %}not-selected-page{% endif %}"
            >Posts</a
          >
        </li>
        <li class="{% if title == 'Resources' %}current-page{% endif %}">
          <a
            href={{ "resources" | url}}
            class="{% if title == 'Resources' %}current-page-color{% else %}not-selected-page{% endif %}"
            >Resources</a
          >
        </li>
      </ul>
      <div class="burger">
        <div class="line1"></div>
        <div class="line2"></div>
        <div class="line3"></div>
      </div>
    </nav>
    <main>{{ content }}</main>
  </body>
</html>
